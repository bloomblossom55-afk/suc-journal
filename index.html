<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신촌연합교회 주일예배일지</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, orderBy, query }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyA5N3_4rGrlMsjTfebPv7XHwlrXnPDmT38",
    authDomain: "suc-journal.firebaseapp.com",
    projectId: "suc-journal",
    storageBucket: "suc-journal.firebasestorage.app",
    messagingSenderId: "191671853524",
    appId: "1:191671853524:web:55806820f5346da886f641"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._col = collection(db, "records");
  window._fns = { collection, addDoc, getDocs, doc, deleteDoc, updateDoc, orderBy, query };
  window._dbReady = true;
  document.dispatchEvent(new Event('db-ready'));
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f0f2f5;color:#111;}
#app{max-width:860px;margin:0 auto;padding:14px;}
.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tab-btn{flex:1;padding:10px;border:none;border-radius:8px;background:#fff;color:#555;font-size:14px;cursor:pointer;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:all .2s;}
.tab-btn.active{background:#1a3a5c;color:#fff;}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:14px;}
.card h2{font-size:17px;font-weight:800;margin-bottom:16px;color:#1a202c;border-bottom:2px solid #1a3a5c;padding-bottom:9px;}
.sec{font-size:11px;font-weight:800;color:#1a3a5c;margin:18px 0 9px;letter-spacing:.5px;}
.part-sel{display:flex;gap:8px;margin-bottom:4px;}
.part-btn{flex:1;padding:9px;border:2px solid #ddd;border-radius:8px;background:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;}
.part-btn.active{border-color:#1a3a5c;background:#1a3a5c;color:#fff;}
.row{display:flex;gap:10px;margin-bottom:9px;flex-wrap:wrap;}
.fg{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px;}
.fg label{font-size:11px;color:#666;font-weight:700;}
.fg input,.fg textarea{border:1px solid #ddd;border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fafafa;transition:border .2s;}
.fg input:focus,.fg textarea:focus{outline:none;border-color:#1a3a5c;background:#fff;}
.fg textarea{resize:none;min-height:80px;overflow:hidden;}
.fixed{background:#eef2ff!important;color:#1a3a5c;font-weight:700;}
.sum-box{background:#eef2ff;border-radius:8px;padding:11px 14px;font-size:13px;font-weight:700;color:#1a3a5c;margin-top:4px;}
.act-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;}
.btn:hover{opacity:.85;}
.btn-primary{background:#1a3a5c;color:#fff;flex:1;}
.btn-sub{background:#e2e8f0;color:#333;}
.btn-print{background:#d1fae5;color:#065f46;}
.btn-danger{background:#fee2e2;color:#991b1b;}
.btn-edit{background:#fef9c3;color:#78350f;}
.btn-back{background:#e2e8f0;color:#333;}
.list-empty{padding:40px;text-align:center;color:#aaa;font-size:14px;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s;}
.list-item:hover{background:#f7faff;}
.list-item:last-child{border-bottom:none;}
.li-title{font-weight:700;font-size:14px;color:#1a202c;}
.li-meta{font-size:11px;color:#888;margin-top:2px;}
.li-arr{color:#ccc;font-size:20px;}
.loading{padding:40px;text-align:center;color:#888;font-size:14px;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:460px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.modal h3{font-size:16px;font-weight:800;margin-bottom:12px;}
.modal p{font-size:13px;color:#555;margin-bottom:8px;line-height:1.6;}
.modal-btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.modal-btns .btn{flex:1;}
#print-area{display:none;}
@media(max-width:600px){.row{flex-direction:column;}.fg{min-width:unset;}}

/* 양식 공통 (미리보기 + 인쇄 공용) */
.pf-wrap{width:100%;font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:13px;color:#000;}
.pf-title{text-align:center;font-size:18px;font-weight:800;padding:0 0 20px;letter-spacing:1px;}
.pf-wrap table{width:100%;border-collapse:collapse;table-layout:fixed;}
.pf-wrap td{font-size:13px;vertical-align:middle;word-break:keep-all;padding:6px 10px;}
.pf-lbl{background:#e8e8e8;font-weight:700;text-align:center;width:100px;min-width:100px;max-width:100px;white-space:nowrap;overflow:hidden;}
.pf-val{background:#fff;}
.t-head{border:1.5px solid #444;}
.t-head td{border:1px solid #888;}
.t-body{border:1.5px solid #444;border-top:none;}
.t-body td{border:1px solid #888;border-top:none;}
.t-body tr:first-child td{border-top:1px solid #888;}
.t-att{border:1.5px solid #444;border-top:none;}
.t-att td{border:1px solid #888;border-top:none;}
.t-att tr:first-child td{border-top:1px solid #888;}
.t-tot{border:1.5px solid #444;border-top:none;}
.t-tot td{border:1px solid #888;border-top:none;}
.t-tot tr:first-child td{border-top:1px solid #888;}
.att-val{background:#fff;vertical-align:top!important;padding:9px 12px!important;line-height:1.9;}
.att-sec{font-weight:700;margin-top:10px;}
.att-sec:first-child{margin-top:0;}
.att-names{word-break:keep-all;margin-top:3px;white-space:normal;}
.tot-val{background:#fff;vertical-align:top!important;padding:8px 12px!important;line-height:2.1;}
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('write',true)">✏️ 일지 작성</button>
    <button class="tab-btn" onclick="showTab('list')">📋 저장된 일지</button>
  </div>

  <div id="tab-write">
    <div class="card">
      <h2>주일예배 일지 작성</h2>
      <div class="sec">예배 순서</div>
      <div class="part-sel">
        <button class="part-btn active" onclick="setPart(1)">1부</button>
        <button class="part-btn" onclick="setPart(2)">2부</button>
        <button class="part-btn" onclick="setPart(3)">3부</button>
      </div>
      <div class="sec">기본 정보</div>
      <div class="row">
        <div class="fg"><label>날짜</label><input type="date" id="f-date"></div>
        <div class="fg"><label>시간</label><input type="time" id="f-time"></div>
        <div class="fg"><label>작성자</label><input type="text" id="f-writer" placeholder="이름 입력"></div>
      </div>
      <div class="sec">예배 내용</div>
      <div class="row">
        <div class="fg"><label>예배의 부름</label><input type="text" id="f-call" class="fixed" value="다같이"></div>
        <div class="fg"><label>신앙고백</label><input type="text" id="f-creed" class="fixed" value="다같이 (사도신경)"></div>
      </div>
      <div class="row">
        <div class="fg"><label>찬양인도</label><input type="text" id="f-praise" placeholder="이름"></div>
        <div class="fg"><label>반주</label><input type="text" id="f-accompany" class="fixed" value="정은정 집사"></div>
        <div class="fg"><label>대표기도</label><input type="text" id="f-prayer" placeholder="이름"></div>
      </div>
      <div class="row">
        <div class="fg"><label>말씀</label><input type="text" id="f-word" placeholder="성경 구절"></div>
        <div class="fg"><label>설교</label><input type="text" id="f-sermon" class="fixed" value="엄태우 목사"></div>
        <div class="fg"><label>설교주제</label><input type="text" id="f-topic" placeholder="설교 주제"></div>
      </div>
      <div class="row">
        <div class="fg"><label>예물 (헌금 위원)</label><input type="text" id="f-offering" placeholder="이름"></div>
        <div class="fg"><label>봉헌기도</label><input type="text" id="f-offerpray" class="fixed" value="엄태우 목사"></div>
        <div class="fg"><label>축복기도</label><input type="text" id="f-bless" class="fixed" value="엄태우 목사"></div>
      </div>
      <div class="sec">참석자 명단</div>
      <div class="row">
        <div class="fg">
          <label>현장 참석자 <span id="cnt-on" style="color:#1a3a5c;">(0명)</span></label>
          <textarea id="f-onsite" placeholder="공백·쉼표·줄바꿈으로 구분&#10;공백 포함 이름은 (홍 길동)처럼 괄호로" oninput="countN();autoResize(this)"></textarea>
        </div>
        <div class="fg">
          <label>온라인 참석자 <span id="cnt-ol" style="color:#1a3a5c;">(0명)</span></label>
          <textarea id="f-online" placeholder="공백·쉼표·줄바꿈으로 구분" oninput="countN();autoResize(this)"></textarea>
        </div>
        <div class="fg">
          <label>방문자 <span id="cnt-vi" style="color:#1a3a5c;">(0명)</span></label>
          <textarea id="f-visitor" placeholder="공백·쉼표·줄바꿈으로 구분" oninput="countN();autoResize(this)"></textarea>
        </div>
      </div>
      <div class="sum-box">
        인원 합계 — 현장: <span id="s-on">0</span>명 &nbsp;/&nbsp; 온라인: <span id="s-ol">0</span>명 &nbsp;/&nbsp; 총: <span id="s-tot">0</span>명
      </div>
      <div class="act-row">
        <button class="btn btn-sub" onclick="resetForm()">초기화</button>
        <button class="btn btn-primary" onclick="saveRecord()">💾 저장</button>
        <button class="btn btn-print" onclick="openPrintModal(null)">🖨️ 인쇄/PDF</button>
      </div>
    </div>
  </div>

  <div id="tab-list" style="display:none;">
    <div class="card" style="padding:0;overflow:hidden;" id="list-container">
      <div class="loading">불러오는 중...</div>
    </div>
  </div>

  <div id="tab-detail" style="display:none;">
    <div class="act-row" style="margin-bottom:12px;">
      <button class="btn btn-back" onclick="showTab('list')">← 목록</button>
      <button class="btn btn-edit" onclick="editRecord()">✏️ 수정</button>
      <button class="btn btn-danger" onclick="deleteRecord()">🗑️ 삭제</button>
      <button class="btn btn-print" onclick="openPrintModal(currentDetailId)">🖨️ 인쇄/PDF</button>
    </div>
    <div id="detail-content"></div>
  </div>

  <div class="modal-bg" id="print-modal">
    <div class="modal">
      <h3>🖨️ 인쇄 / PDF 저장</h3>
      <p>새 탭에서 양식이 열리고 인쇄 화면이 자동으로 실행됩니다.</p>
      <p><strong>📱 모바일:</strong> 인쇄 화면에서 <strong>「PDF로 저장」</strong> 선택 후 카카오톡·드롭박스로 공유하세요.</p>
      <p><strong>💡 팁:</strong> 인쇄 설정에서 <strong>머릿글/바닥글 없음</strong>, <strong>배경 그래픽 포함</strong>을 설정하면 깔끔하게 출력됩니다.</p>
      <div class="modal-btns">
        <button class="btn btn-sub" onclick="closePrintModal()">취소</button>
        <button class="btn btn-primary" onclick="doPrint()">인쇄 화면 열기</button>
      </div>
    </div>
  </div>
  <div id="print-area"></div>
</div>

<script>
var currentPart = 1;
var currentDetailId = null;
var records = [];
var pendingPrintId = null;
var partTimes = {1:'09:00', 2:'11:20', 3:'15:30'};

function waitDB(fn) {
  if (window._dbReady) fn();
  else document.addEventListener('db-ready', fn, {once:true});
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function init() {
  setToday();
  document.getElementById('f-time').value = '09:00';
}

function setToday() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  document.getElementById('f-date').value = y+'-'+m+'-'+dd;
}

function setPart(n) {
  currentPart = n;
  document.querySelectorAll('.part-btn').forEach(function(b,i){ b.classList.toggle('active', i===n-1); });
  document.getElementById('f-time').value = partTimes[n];
}

function parseNames(s) {
  if (!s || !s.trim()) return [];
  var bracketed = [];
  s = s.replace(/\(([^)]+)\)/g, function(_, inner) {
    bracketed.push(inner.trim());
    return '__N'+(bracketed.length-1)+'__';
  });
  return s.split(/[\s,\n]+/).map(function(x){ return x.trim(); }).filter(function(x){ return x.length > 0; }).map(function(x) {
    var m = x.match(/^__N(\d+)__$/);
    return m ? bracketed[parseInt(m[1])] : x;
  });
}

function countN() {
  var on = parseNames(document.getElementById('f-onsite').value);
  var ol = parseNames(document.getElementById('f-online').value);
  var vi = parseNames(document.getElementById('f-visitor').value);
  document.getElementById('cnt-on').textContent = '('+on.length+'명)';
  document.getElementById('cnt-ol').textContent = '('+ol.length+'명)';
  document.getElementById('cnt-vi').textContent = '('+vi.length+'명)';
  document.getElementById('s-on').textContent = on.length+vi.length;
  document.getElementById('s-ol').textContent = ol.length;
  document.getElementById('s-tot').textContent = on.length+ol.length+vi.length;
}

function showTab(t, fromTab) {
  ['write','list','detail'].forEach(function(id) {
    document.getElementById('tab-'+id).style.display = id===t ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(function(b,i) {
    b.classList.toggle('active', (i===0&&t==='write')||(i===1&&(t==='list'||t==='detail')));
  });
  if (t === 'list') renderList();
  if (t === 'write' && fromTab) resetForm();
}

function collectForm() {
  return {
    part: currentPart,
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    writer: document.getElementById('f-writer').value,
    call: document.getElementById('f-call').value,
    creed: document.getElementById('f-creed').value,
    praise: document.getElementById('f-praise').value,
    accompany: document.getElementById('f-accompany').value,
    prayer: document.getElementById('f-prayer').value,
    word: document.getElementById('f-word').value,
    sermon: document.getElementById('f-sermon').value,
    topic: document.getElementById('f-topic').value,
    offering: document.getElementById('f-offering').value,
    offerpray: document.getElementById('f-offerpray').value,
    bless: document.getElementById('f-bless').value,
    onsite: parseNames(document.getElementById('f-onsite').value),
    online: parseNames(document.getElementById('f-online').value),
    visitor: parseNames(document.getElementById('f-visitor').value),
    createdAt: Date.now()
  };
}

function fillForm(r) {
  setPart(r.part);
  ['date','time','writer','call','creed','praise','accompany','prayer','word','sermon','topic','offering','offerpray','bless'].forEach(function(k) {
    var el = document.getElementById('f-'+k);
    if (el) el.value = r[k] || '';
  });
  document.getElementById('f-onsite').value = (r.onsite||[]).join(' ');
  document.getElementById('f-online').value = (r.online||[]).join(' ');
  document.getElementById('f-visitor').value = (r.visitor||[]).join(' ');
  countN();
  ['f-onsite','f-online','f-visitor'].forEach(function(id) {
    autoResize(document.getElementById(id));
  });
}

function resetForm() {
  document.querySelectorAll('#tab-write input,#tab-write textarea').forEach(function(el) {
    if (!el.classList.contains('fixed')) el.value = '';
  });
  document.getElementById('f-call').value = '다같이';
  document.getElementById('f-creed').value = '다같이 (사도신경)';
  document.getElementById('f-accompany').value = '정은정 집사';
  document.getElementById('f-sermon').value = '엄태우 목사';
  document.getElementById('f-offerpray').value = '엄태우 목사';
  document.getElementById('f-bless').value = '엄태우 목사';
  currentDetailId = null;
  setToday();
  setPart(1);
  countN();
  ['f-onsite','f-online','f-visitor'].forEach(function(id) {
    var el = document.getElementById(id);
    el.style.height = 'auto';
  });
}

function saveRecord() {
  var r = collectForm();
  if (!r.date) { alert('날짜를 입력해주세요.'); return; }
  waitDB(function() {
    if (currentDetailId) {
      var ex = records.find(function(x){ return x._id === currentDetailId; });
      if (ex) r.createdAt = ex.createdAt;
      window._fns.updateDoc(window._fns.doc(window._db,'records',currentDetailId), r).then(function() {
        currentDetailId = null;
        alert('수정되었습니다!');
        showTab('list');
      }).catch(function(e){ alert('저장 실패: '+e.message); });
    } else {
      window._fns.addDoc(window._col, r).then(function() {
        alert('저장되었습니다!');
        showTab('list');
      }).catch(function(e){ alert('저장 실패: '+e.message); });
    }
  });
}

function loadRecords() {
  return new Promise(function(resolve) {
    waitDB(function() {
      var q = window._fns.query(window._col, window._fns.orderBy('createdAt','desc'));
      window._fns.getDocs(q).then(function(snap) {
        var recs = snap.docs.map(function(d){ return Object.assign({}, d.data(), {_id:d.id}); });
        recs.sort(function(a,b){
          if (b.date !== a.date) return b.date.localeCompare(a.date);
          return (a.part||1)-(b.part||1);
        });
        records = recs;
        resolve(records);
      }).catch(function(e){ console.error(e); records=[]; resolve([]); });
    });
  });
}

function deleteRecord() {
  if (!confirm('삭제하시겠습니까?')) return;
  waitDB(function() {
    window._fns.deleteDoc(window._fns.doc(window._db,'records',currentDetailId)).then(function() {
      currentDetailId = null;
      showTab('list');
    }).catch(function(e){ alert('삭제 실패: '+e.message); });
  });
}

function fmtDate(d) {
  if (!d) return '';
  var parts = d.split('-');
  return parts[0]+'년 '+parts[1]+'월 '+parts[2]+'일';
}

function renderList() {
  var c = document.getElementById('list-container');
  c.innerHTML = '<div class="loading">불러오는 중...</div>';
  loadRecords().then(function() {
    if (!records.length) { c.innerHTML='<div class="list-empty">저장된 일지가 없습니다.</div>'; return; }
    c.innerHTML = records.map(function(r) {
      return '<div class="list-item" onclick="openDetail(\''+r._id+'\')">'
        +'<div>'
        +'<div class="li-title">신촌연합교회 주일예배일지 ('+r.part+'부)</div>'
        +'<div class="li-meta">'+fmtDate(r.date)+' · 작성자: '+(r.writer||'-')+' · 현장 '+((r.onsite||[]).length+(r.visitor||[]).length)+'명 / 온라인 '+(r.online||[]).length+'명</div>'
        +'</div>'
        +'<div class="li-arr">›</div>'
        +'</div>';
    }).join('');
  });
}

function openDetail(id) {
  currentDetailId = id;
  var r = records.find(function(x){ return x._id===id; });
  if (!r) return;
  document.getElementById('detail-content').innerHTML = buildPF(r);
  showTab('detail');
}

function editRecord() {
  var r = records.find(function(x){ return x._id===currentDetailId; });
  if (!r) return;
  fillForm(r);
  showTab('write');
}

function openPrintModal(id) { pendingPrintId=id; document.getElementById('print-modal').classList.add('open'); }
function closePrintModal() { document.getElementById('print-modal').classList.remove('open'); }

function doPrint() {
  closePrintModal();
  var r = pendingPrintId===null ? collectForm() : records.find(function(x){ return x._id===pendingPrintId; });
  if (!r) return;
  var html = buildPageHTML(r);
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var win = window.open(url, '_blank');
  if (!win) alert('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해주세요.');
  setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
}

function chunkNames(arr) {
  return arr.join('  ');
}

function buildPF(r) {
  var on = r.onsite||[], ol = r.online||[], vi = r.visitor||[];
  var totOn = on.length+vi.length, totOl = ol.length, tot = totOn+totOl;
  var dateStr = '년    월    일', timeStr = '';
  if (r.date) {
    var dp = r.date.split('-');
    dateStr = dp[0]+'년 '+parseInt(dp[1])+'월 '+parseInt(dp[2])+'일';
  }
  if (r.time) {
    var tp = r.time.split(':');
    var h = parseInt(tp[0]), m = tp[1];
    var ap = h<12?'오전':'오후';
    var hh = h===0?12:h>12?h-12:h;
    timeStr = ' '+ap+' '+hh+'시'+(m!=='00'?' '+m+'분':'');
  }
  var onsiteStr  = chunkNames(on, 9);
  var onlineStr  = chunkNames(ol, 9);
  var visitorStr = chunkNames(vi, 9);

  return '<div class="pf-wrap">'
    +'<div class="pf-title">신촌연합교회 주일예배일지 ('+r.part+'부)</div>'
    +'<table class="t-head"><colgroup><col style="width:100px"><col><col style="width:60px"><col style="width:110px"></colgroup>'
    +'<tr><td class="pf-lbl">일시</td><td class="pf-val">'+dateStr+timeStr+'</td>'
    +'<td class="pf-lbl">작성자</td><td class="pf-val">'+(r.writer||'')+'</td></tr></table>'
    +'<table class="t-body"><colgroup><col style="width:100px"><col></colgroup>'
    +'<tr><td class="pf-lbl">예배의 부름</td><td class="pf-val">'+(r.call||'다같이')+'</td></tr>'
    +'<tr><td class="pf-lbl">신앙고백</td><td class="pf-val">'+(r.creed||'다같이 (사도신경)')+'</td></tr>'
    +'<tr><td class="pf-lbl">찬양인도</td><td class="pf-val">'+(r.praise||'')+'</td></tr>'
    +'<tr><td class="pf-lbl">반주</td><td class="pf-val">'+(r.accompany||'정은정 집사')+'</td></tr>'
    +'<tr><td class="pf-lbl">대표기도</td><td class="pf-val">'+(r.prayer||'')+'</td></tr>'
    +'<tr><td class="pf-lbl">말씀</td><td class="pf-val">'+(r.word||'')+'</td></tr>'
    +'<tr><td class="pf-lbl">설교</td><td class="pf-val">'+(r.sermon||'엄태우 목사')+'</td></tr>'
    +'<tr><td class="pf-lbl">설교주제</td><td class="pf-val">'+(r.topic||'')+'</td></tr>'
    +'<tr><td class="pf-lbl">예물</td><td class="pf-val">'+(r.offering||'')+'</td></tr>'
    +'<tr><td class="pf-lbl">봉헌기도</td><td class="pf-val">'+(r.offerpray||'엄태우 목사')+'</td></tr>'
    +'<tr><td class="pf-lbl">축복기도</td><td class="pf-val">'+(r.bless||'엄태우 목사')+'</td></tr>'
    +'</table>'
    +'<table class="t-att"><colgroup><col style="width:100px"><col></colgroup>'
    +'<tr><td class="pf-lbl" style="vertical-align:top;padding-top:10px;">참석자명단</td>'
    +'<td class="att-val">'
    +(on.length ? '<div class="att-sec">&lt;현장&gt;</div><div class="att-names" style="margin-bottom:10px;">'+onsiteStr+'</div>' : '')
    +(ol.length ? '<div class="att-sec">&lt;온라인&gt;</div><div class="att-names" style="margin-bottom:10px;">'+onlineStr+'</div>' : '')
    +(vi.length ? '<div class="att-sec">&lt;방문자&gt;</div><div class="att-names">'+visitorStr+'</div>' : '')
    +(!on.length&&!ol.length&&!vi.length ? '　' : '')
    +'</td></tr></table>'
    +'<table class="t-tot"><colgroup><col style="width:100px"><col></colgroup>'
    +'<tr><td class="pf-lbl" style="line-height:1.6;">참석자<br>인원합계</td>'
    +'<td class="tot-val">현장&nbsp;&nbsp;&nbsp;'+totOn+'명<br>온라인&nbsp;'+totOl+'명<br>총&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'+tot+'명</td>'
    +'</tr></table>'
    +'</div>';
}

    +'<meta name="viewport" content="width=device-width,initial-scale=1.0">\n'
    +'<title>신촌연합교회 주일예배일지 ('+r.part+'부)</title>\n'
    +'<style>\n'
    +'*{box-sizing:border-box;margin:0;padding:0;}\n'
    +'html,body{font-family:\'맑은 고딕\',\'Malgun Gothic\',\'Apple SD Gothic Neo\',sans-serif;background:#fff;color:#000;-webkit-font-smoothing:antialiased;}\n'
    +'body{padding:10mm 13mm 8mm;}\n'
    +'.pf-wrap{width:100%;}\n'
    +'.pf-title{text-align:center;font-size:20pt;font-weight:800;padding:0 0 18px;letter-spacing:1px;}\n'
    +'.pf-wrap table{width:100%;border-collapse:collapse;table-layout:fixed;}\n'
    +'.pf-wrap td{font-size:11pt;vertical-align:middle;word-break:keep-all;padding:5px 10px;}\n'
    +'.pf-lbl{background:#e8e8e8!important;font-weight:700;text-align:center;width:100px;min-width:100px;max-width:100px;white-space:nowrap;overflow:hidden;}\n'
    +'.pf-val{background:#fff;}\n'
    +'.t-head{border:1.5px solid #333;}\n'
    +'.t-head td{border:1px solid #888;}\n'
    +'.t-body{border:1.5px solid #333;border-top:none;}\n'
    +'.t-body td{border:1px solid #888;border-top:none;}\n'
    +'.t-body tr:first-child td{border-top:1px solid #888;}\n'
    +'.t-att{border:1.5px solid #333;border-top:none;}\n'
    +'.t-att td{border:1px solid #888;border-top:none;}\n'
    +'.t-att tr:first-child td{border-top:1px solid #888;}\n'
    +'.t-tot{border:1.5px solid #333;border-top:none;}\n'
    +'.t-tot td{border:1px solid #888;border-top:none;}\n'
    +'.t-tot tr:first-child td{border-top:1px solid #888;}\n'
    +'.att-val{background:#fff;vertical-align:top!important;padding:9px 12px!important;line-height:1.9;font-size:10.5pt;}\n'
    +'.att-sec{font-weight:700;margin-top:10px;font-size:11pt;}\n'
    +'.att-sec:first-child{margin-top:0;}\n'
    +'.att-names{word-break:keep-all;margin-top:3px;white-space:normal;}\n'
    +'.tot-val{background:#fff;vertical-align:top!important;padding:8px 12px!important;line-height:2.1;font-size:11pt;}\n'
    +'@media print{@page{size:A4 portrait;margin:10mm 13mm;}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}}\n'
    +'</style>\n</head>\n<body>\n'
    + buildPF(r)
    +'\n<script>var t=setTimeout(function(){window.print();},2000);document.fonts.ready.then(function(){clearTimeout(t);window.print();});<\/script>\n'
    +'</body>\n</html>';
}

init();
</script>
